# Tools for maintaining the course, not for following it: a reader needs
# only a C compiler and make. The Makefile runs these (make lint, make
# format) through `uv run --frozen`, so the versions are the ones locked in
# uv.lock, here and in CI.

[project]
name = "c-by-example"
version = "0.1.0"
requires-python = ">=3.10"

[dependency-groups]
lint = [
  "mdformat==1.0.0",
  "mdformat-gfm==1.0.0",         # tables, autolinks, ~~strike~~
  "mdformat-gfm-alerts==2.1.0",  # > [!TIP] boxes, left as written
  "clang-format==22.1.8",        # the C style, as ~/doppler pins it
]

[tool.uv]
package = false
