name: site

# The c-by-example website: `make docs` on every change to the course, so a
# page that won't build, or a link that leads nowhere, fails the PR; and on
# main, the built site is published to GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["c-by-example/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["c-by-example/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: make docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.21"
      # Links to code go to GitHub at the commit being built: a PR's own
      # head, not the merge commit GitHub makes to test it.
      - run: make -C c-by-example docs
        env:
          SITE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      # make exits 0 when it has nothing to do; require the front page.
      - run: test -s c-by-example/build/site/html/index.html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: c-by-example/build/site/html

  deploy:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
