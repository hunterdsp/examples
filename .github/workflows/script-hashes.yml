name: script-hashes

# scripts/README.md lists each script's sha256 for `jbx -k`. A stale row makes jbx
# refuse the script it names, so every change to a script or to the table
# must leave them in step.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/scripts/check-hashes.sh"
      - "Makefile"
      - ".github/workflows/script-hashes.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/scripts/check-hashes.sh"
      - "Makefile"
      - ".github/workflows/script-hashes.yml"
  workflow_dispatch:

jobs:
  hashes:
    name: README hash table matches scripts/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: make lint-hashes
